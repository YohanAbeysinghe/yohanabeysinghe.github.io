name: Build and publish academic site

on:
  push:
    branches: [master, migration/al-folio]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby and install locked dependencies
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Production Jekyll build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Check site integrity and publication records
        run: python3 scripts/verify_site.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy built artifact
        id: deployment
        uses: actions/deploy-pages@v4
